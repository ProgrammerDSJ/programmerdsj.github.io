<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post - Devansh Jhawar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page-header {
            text-align: center;
            padding: 8rem 0 3rem;
            background: linear-gradient(135deg, var(--section-bg) 0%, var(--background) 100%);
        }
        .content-container {
            padding: 3rem 0;
            text-align: center;
        }
        .back-button {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <div class="logo">
                <a href="index.html#home">
                    <img src="Devansh YT.jpg" alt="Devansh Jhawar" class="logo-image">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#education">Education</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#blog">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1>Blog Post</h1>
            <p>Article coming soon</p>
        </div>
    </header>

    <!-- Content Section -->
    <section>
        <div class="container content-container">
            <p>This blog post is currently under development.</p>
            <div class="view-all-container">
                <a href="index.html#blog" class="btn back-button">Back to Blogs</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 Devansh Jhawar. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile Navigation
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
